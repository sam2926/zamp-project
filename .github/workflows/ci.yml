name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · tests + performance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # the version the app is validated on and deployed with
          cache: pip
      # Light deps only — OCR and the model are mocked, so no 2.5 GB PyTorch download.
      - run: pip install -r requirements-dev.txt
      # Unit + contract tests, and the performance regression gate over the saved val run
      # (accuracy >= 0.75, tokens <= 0.90 x baseline). No model is called.
      - run: pytest

  frontend:
    name: frontend · types + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b && vite build — fails on any type or build error
